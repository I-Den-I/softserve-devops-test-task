---
- name: Clean up all old repo files to avoid "multiple times" errors
  shell: rm -f /etc/apt/sources.list.d/jenkins.list /etc/apt/sources.list.d/hashicorp.list /etc/apt/sources.list.d/apt_releases_hashicorp_com.list
  become: yes

- name: Install Java 17, Git and dependencies
  apt:
    name: [fontconfig, openjdk-17-jre, curl, gnupg, git]
    state: present
    update_cache: yes

- name: Create keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download the Jenkins GPG key
  get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Add Jenkins repository
  copy:
    dest: /etc/apt/sources.list.d/jenkins.list
    content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Ensure Jenkins is started and enabled
  systemd:
    name: jenkins
    state: started
    enabled: yes