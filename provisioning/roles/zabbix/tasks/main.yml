---
# --- 1. Встановлення Docker ---
- name: Install prerequisite packages for Docker
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present

- name: Create directory for Docker keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker and Docker Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: yes

# --- 2. Мережеві фікси (DNS) ---
- name: Fix VMware DNS resolution issue permanently (dhclient)
  lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^#?supersede domain-name-servers'
    line: 'supersede domain-name-servers 8.8.8.8, 1.1.1.1;'

- name: Apply DNS fix immediately to resolv.conf
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 8.8.8.8
      nameserver 1.1.1.1

# --- 3. Розгортання Zabbix Server у Docker ---
- name: Create Zabbix directory
  file:
    path: /opt/zabbix
    state: directory
    mode: '0755'

- name: Deploy Zabbix docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/zabbix/docker-compose.yml

- name: Start Zabbix Server via Docker Compose
  command: docker compose up -d
  args:
    chdir: /opt/zabbix
  register: docker_compose_output
  changed_when: "'Started' in docker_compose_output.stdout or 'Created' in docker_compose_output.stdout"

# --- 4. Встановлення та налаштування нативного Zabbix Agent ---
- name: Download Zabbix 7.0 repository package
  get_url:
    url: "https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix-release/zabbix-release_7.0-2+debian12_all.deb"
    dest: "/tmp/zabbix-release_7.0.deb"

- name: Install Zabbix repository
  apt:
    deb: "/tmp/zabbix-release_7.0.deb"

- name: Install Zabbix Agent
  apt:
    name: zabbix-agent
    state: present
    update_cache: yes

- name: Configure Agent - Allow Docker Network Access
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^#? ?Server='
    line: 'Server=127.0.0.1,172.16.0.0/12'
  notify: Restart Zabbix Agent

- name: Configure Agent - Active Server
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^#? ?ServerActive='
    line: 'ServerActive=127.0.0.1'
  notify: Restart Zabbix Agent

- name: Ensure Zabbix Agent include directory exists
  file:
    path: /etc/zabbix/zabbix_agentd.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Ensure Agent includes custom config directory
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^#? ?Include=/etc/zabbix/zabbix_agentd.d/\*\.conf'
    line: 'Include=/etc/zabbix/zabbix_agentd.d/*.conf'
  become: yes
  notify: Restart Zabbix Agent

- name: Add UserParameter template for Service Monitoring
  template:
    src: custom_user_parameters.conf.j2
    dest: /etc/zabbix/zabbix_agentd.d/custom_services.conf
  become: yes
  notify: Restart Zabbix Agent

- name: Start and enable Zabbix Agent
  systemd:
    name: zabbix-agent
    state: started
    enabled: yes

# --- 5. Автоматизація інтерфейсу Zabbix (SQL Fix) ---
- name: Wait for services to initialize
  pause:
    seconds: 45

- name: Get Zabbix Postgres container name
  command: docker ps --filter "label=com.docker.compose.service=postgres-server" --format "{% raw %}{{.Names}}{% endraw %}"
  register: db_container_name
  changed_when: false

- name: Set host to use DNS host.docker.internal via SQL
  command: >
    docker exec {{ db_container_name.stdout }} psql -U zabbix -d zabbix -c 
    "UPDATE interface SET useip=0, dns='host.docker.internal', ip='' WHERE hostid=(SELECT hostid FROM hosts WHERE host='Zabbix server');"
  when: db_container_name.stdout != ""

# --- 6. Автоматизація створення Items через Zabbix API ---
- name: Authenticate to Zabbix API (wait for UI to be ready)
  uri:
    url: "http://127.0.0.1:8085/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "user.login"
      params:
        username: "Admin"
        password: "zabbix" 
      id: 1
  register: zabbix_auth
  until: zabbix_auth.status == 200 and 'result' in zabbix_auth.json
  retries: 30
  delay: 10 

- name: Get Zabbix server Host ID
  uri:
    url: "http://127.0.0.1:8085/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "host.get"
      params:
        filter:
          host: ["Zabbix server"]
      auth: "{{ zabbix_auth.json.result }}"
      id: 2
  register: zabbix_host

- name: Get Zabbix server Interface ID
  uri:
    url: "http://127.0.0.1:8085/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "hostinterface.get"
      params:
        hostids: ["{{ zabbix_host.json.result[0].hostid }}"]
      auth: "{{ zabbix_auth.json.result }}"
      id: 3
  register: zabbix_interface

- name: Create Monitoring Items for Services via API
  uri:
    url: "http://127.0.0.1:8085/api_jsonrpc.php"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: "item.create"
      params:
        name: "{{ item.name }}"
        key_: "{{ item.key }}"
        hostid: "{{ zabbix_host.json.result[0].hostid }}"
        interfaceid: "{{ zabbix_interface.json.result[0].interfaceid }}"
        type: 0 
        value_type: 3 
        delay: "30s"
      auth: "{{ zabbix_auth.json.result }}"
      id: 4
  loop:
    - { name: "Jenkins Service Status", key: "custom.service.status[jenkins]" }
    - { name: "Vault Service Status", key: "custom.service.status[vault]" }
    - { name: "Zabbix Server Status", key: "custom.service.status[docker]" } 
  ignore_errors: yes