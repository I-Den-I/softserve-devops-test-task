---
# --- 1. Встановлення Docker ---
- name: Install prerequisite packages for Docker
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present

- name: Create directory for Docker keyrings
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository
  apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Install Docker and Docker Compose
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: yes

# --- 2. Мережеві фікси для VMware/Apple Silicon ---
- name: Fix VMware DNS resolution issue permanently (dhclient)
  lineinfile:
    path: /etc/dhcp/dhclient.conf
    regexp: '^#?supersede domain-name-servers'
    line: 'supersede domain-name-servers 8.8.8.8, 1.1.1.1;'

- name: Apply DNS fix immediately to resolv.conf
  copy:
    dest: /etc/resolv.conf
    content: |
      nameserver 8.8.8.8
      nameserver 1.1.1.1

# --- 3. Розгортання Zabbix Server у Docker ---
- name: Create Zabbix directory
  file:
    path: /opt/zabbix
    state: directory
    mode: '0755'

- name: Deploy Zabbix docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: /opt/zabbix/docker-compose.yml

- name: Start Zabbix Server via Docker Compose
  command: docker compose up -d
  args:
    chdir: /opt/zabbix
  register: docker_compose_output
  changed_when: "'Started' in docker_compose_output.stdout or 'Created' in docker_compose_output.stdout"

# --- 4. Встановлення та налаштування нативного Zabbix Agent ---
- name: Download Zabbix 7.0 repository package
  get_url:
    url: "https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix-release/zabbix-release_7.0-2+debian12_all.deb"
    dest: "/tmp/zabbix-release_7.0.deb"

- name: Install Zabbix repository
  apt:
    deb: "/tmp/zabbix-release_7.0.deb"

- name: Install Zabbix Agent
  apt:
    name: zabbix-agent
    state: present
    update_cache: yes

- name: Configure Agent - Allow Docker Network
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^#? ?Server='
    line: 'Server=127.0.0.1,172.16.0.0/12'
  notify: Restart Zabbix Agent

- name: Configure Agent - Active Server
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^#? ?ServerActive='
    line: 'ServerActive=127.0.0.1'
  notify: Restart Zabbix Agent

- name: Add UserParameter for Service Monitoring (Jenkins, Vault, Zabbix)
  lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: '^UserParameter=custom\.service\.status'
    line: 'UserParameter=custom.service.status[*],systemctl is-active --quiet $1 && echo 1 || echo 0'
    insertafter: EOF
  notify: Restart Zabbix Agent

- name: Start and enable Zabbix Agent
  systemd:
    name: zabbix-agent
    state: started
    enabled: yes